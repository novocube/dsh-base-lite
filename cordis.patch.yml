# Pure configuration Bundle: add a separate base-lite preset without replacing
# built-in modes. Model and provider settings are inherited from the host.
- insert:
  - id: preset-base-lite
    name: '@deepseek-ai/dsh-agent-preset'
    config:
      id: base-lite
      name: 轻量模式（base-lite）
      description: >-
        低延迟通用 Agent：提供本地文件与命令、联网搜索/网页抓取、Goal、Todo、
        Workflow 和长对话压缩；不加载 Skills、Office、日程或直接子 Agent。
      order: 6
      plugins:
        - id: persona
          name: '@deepseek-ai/dsh-persona'
          config:
            prefix: You are a concise, helpful assistant powered by the {{model}} model.
        - id: agent-instructions
          name: '@deepseek-ai/dsh-agent-instructions'
          config:
            maxBytes: 65536
        - id: time-context
          name: '@deepseek-ai/dsh-time-context'
        - id: tool-bash
          name: '@deepseek-ai/dsh-tool-bash'
          disabled: !!js process.platform === 'win32'
        - id: tool-pwsh
          name: '@deepseek-ai/dsh-tool-pwsh'
          disabled: !!js process.platform !== 'win32'
        - id: tool-fs
          name: '@deepseek-ai/dsh-tool-fs'
          config:
            applyPatch: false
        - id: tool-fs-search
          name: '@deepseek-ai/dsh-tool-fs-search'
          config:
            sampleOverCapGlobResults: false
        - id: tool-jobs
          name: '@deepseek-ai/dsh-tool-jobs'
        - id: command-goal
          name: '@deepseek-ai/dsh-command-goal'
        - id: tool-goal
          name: '@deepseek-ai/dsh-tool-goal'
        - id: compaction
          name: cordis:group
          group: true
          isolate:
            compaction: true
            toolResultPruner: true
          config:
            - id: compaction-basic
              name: '@deepseek-ai/dsh-compaction-basic'
            - id: command-compact
              name: '@deepseek-ai/dsh-command-compact'
            - id: tool-result-pruner
              name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
              config:
                thresholdChars: 8192
                headChars: 4096
                tailChars: 1024
        - id: workflow
          name: cordis:group
          group: true
          isolate:
            workflowEngine: true
          config:
            - id: workflow-ptc
              name: '@deepseek-ai/dsh-workflow-ptc'
              config:
                provider: spawn
            - id: tool-workflow
              name: '@deepseek-ai/dsh-tool-workflow'
        - id: tool-todo
          name: '@deepseek-ai/dsh-tool-todo'
          config:
            allowParallelInProgress: true
        - id: tool-web
          name: '@deepseek-ai/dsh-tool-web'
          config:
            fetch: true
            searchTimeoutMs: 60000
